
name: Build THE LOST ROOM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          if [ -f /tmp/templates/templates.zip ]; then
            unzip -q /tmp/templates/templates.zip -d /tmp/templates/unpacked
          fi
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          TEMPLATE="$(find /tmp/templates -type f -name android_debug.apk -print -quit)"
          test -n "$TEMPLATE"
          cp "$(dirname "$TEMPLATE")"/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Prepare project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_FILE="$(find extracted -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android export
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="org.example.thelostroom"
          package/name="THE LOST ROOM"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF
          mkdir -p build

      - name: Export APK
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --import --quit
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/THE_LOST_ROOM.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-LOST-ROOM-APK
          path: build/THE_LOST_ROOM.apk
          if-no-files-found: error
